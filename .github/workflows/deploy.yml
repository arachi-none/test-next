name: Build & Deploy Next.js

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          retention-days: 7

      - name: Upload node_modules
        uses: actions/upload-artifact@v4
        with:
          name: node-modules
          path: node_modules/
          retention-days: 7

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next/

      - name: Download node_modules
        uses: actions/download-artifact@v4
        with:
          name: node-modules
          path: node_modules/

      - name: Deploy to production folder
        run: |
          mkdir -p /home/adminit/webs/cms-prod
          cp -r .next/ node_modules/ package.json next.config.mjs next-env.d.ts /home/adminit/webs/cms-prod/

      - name: Restart PM2
        run: |
          cd /home/adminit/webs/cms-prod
          pm2 restart blog-cms || pm2 start npm --name "blog-cms" -- run start
          pm2 save
