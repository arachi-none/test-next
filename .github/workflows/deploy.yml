name: Build & Deploy Next.js

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Show build output
        run: ls -la .next/static/css/
      - name: Cache build output
        uses: actions/cache/save@v4
        with:
          path: |
            .next/
            node_modules/
            app/
            components/
            lib/
            public/
            next-env.d.ts
            package.json
            next.config.mjs
            tailwind.config.js
            postcss.config.js
          key: next-build-${{ github.run_id }}-${{ github.run_attempt }}

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Restore build output
        uses: actions/cache/restore@v4
        with:
          path: |
            .next/
            node_modules/
            app/
            components/
            lib/
            public/
            next-env.d.ts
            package.json
            next.config.mjs
            tailwind.config.js
            postcss.config.js
          key: next-build-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy to production
        run: |
          mkdir -p /home/adminit/webs/cms-prod
          cp -r .next/ app/ components/ lib/ public/ node_modules/ package.json next.config.mjs next-env.d.ts tailwind.config.js postcss.config.js /home/adminit/webs/cms-prod/
      - name: Restart PM2
        run: |
          cd /home/adminit/webs/cms-prod
          pm2 restart blog-cms || pm2 start npm --name "blog-cms" -- run start
          pm2 save
